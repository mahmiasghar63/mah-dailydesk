name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install application and audit tool
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
      - name: Audit resolved dependencies
        run: python -m pip_audit --strict

  source-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install "bandit>=1.8,<2"
      - name: Scan application source
        run: python -m bandit -r dailydesk main.py -ll -x tests --skip B608
