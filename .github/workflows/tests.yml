name: Python checks

on:
  push:
  pull_request:

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile source
        run: python -m compileall -q dailydesk main.py
      - name: Test database and business logic
        run: python -m pytest -q tests/test_storage.py

  gui-smoke:
    # Use Windows, our supported release target. Ubuntu mirror DNS outages
    # previously failed package installation before the test even started.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install GUI and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run GUI smoke test headlessly
        run: python -m pytest -q tests/test_gui.py