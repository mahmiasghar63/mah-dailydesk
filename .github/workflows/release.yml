name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths:
      - 'release/VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mah-dailydesk-release
  cancel-in-progress: false

jobs:
  windows-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content release/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release/VERSION" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Refuse to overwrite an existing version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release tag $tag already exists. Bump release/VERSION and both application version fields before publishing." }
      - name: Require a verified signing provider (fail closed)
        id: signing
        shell: pwsh
        env:
          SIGNING_PROVIDER: ${{ vars.SIGNING_PROVIDER }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORG }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT }}
          SIGNPATH_POLICY: ${{ vars.SIGNPATH_POLICY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          $provider = $env:SIGNING_PROVIDER.Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($provider)) { $provider = 'signpath' }
          if ($provider -eq 'signpath') {
            $required = @('SIGNPATH_API_TOKEN','SIGNPATH_ORG','SIGNPATH_PROJECT','SIGNPATH_POLICY')
          } elseif ($provider -eq 'azure') {
            $required = @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','SIGNING_ENDPOINT','SIGNING_ACCOUNT','SIGNING_PROFILE')
            if ([string]::IsNullOrWhiteSpace($env:SIGNING_ENDPOINT) -or -not $env:SIGNING_ENDPOINT.StartsWith('https://') -or -not $env:SIGNING_ENDPOINT.Contains('.codesigning.azure.net')) { throw 'Set a valid regional Artifact Signing endpoint.' }
          } else {
            throw 'Unsupported SIGNING_PROVIDER. Choose signpath or azure.'
          }
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "A verified Authenticode signature is REQUIRED for new releases. Configure $provider before publishing. Missing: $($missing -join ', '). See CODE_SIGNING.md."
          }
          "provider=$provider" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt "Pillow>=10,<12"
      - name: Check application version matches release
        shell: pwsh
        run: |
          $version = python -c 'import dailydesk; print(dailydesk.__version__)'
          if ($version.Trim() -ne '${{ steps.version.outputs.version }}') { throw 'Package version mismatch' }
      - name: Run unit and GUI smoke tests
        run: python -m pytest -q
      - name: Compile application modules
        run: python -m compileall -q dailydesk main.py tools
      - name: Generate Windows icon
        run: python tools/create_icon.py
      - name: Capture real GUI previews (disposable demo data)
        run: python -m tools.capture_screenshots
      - name: Build standalone Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MAH-DailyDesk --icon assets/MAH-DailyDesk.ico main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Smoke-test packaged executable
        run: python -m tools.smoke_frozen dist/MAH-DailyDesk/MAH-DailyDesk.exe
      - name: Stage unsigned EXE for SignPath origin verification
        id: signpath-unsigned
        if: steps.signing.outputs.provider == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-unsigned-exe-${{ github.run_id }}
          path: dist/MAH-DailyDesk/MAH-DailyDesk.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign EXE via approved SignPath project
        if: steps.signing.outputs.provider == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG }}
          project-slug: ${{ vars.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.signpath-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signpath-signed
      - name: Install SignPath-signed EXE
        if: steps.signing.outputs.provider == 'signpath'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/signpath-signed" -Recurse -Filter "MAH-DailyDesk.exe" -File)
          if ($files.Count -ne 1) { throw "Expected exactly one signed MAH-DailyDesk.exe, got $($files.Count)." }
          Copy-Item -LiteralPath $files[0].FullName -Destination 'dist/MAH-DailyDesk/MAH-DailyDesk.exe' -Force
      - name: Authenticate to Azure with short-lived OIDC credentials
        if: steps.signing.outputs.provider == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign EXE using verified Azure Artifact Signing identity
        if: steps.signing.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}/dist/MAH-DailyDesk/MAH-DailyDesk.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify trusted Authenticode signature and timestamp
        shell: pwsh
        run: |
          $exe = 'dist/MAH-DailyDesk/MAH-DailyDesk.exe'
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Windows Authenticode verification failed: $($signature.Status). Refusing to publish."
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'No trusted RFC3161 timestamp certificate found. Refusing to publish.'
          }
          $codeSigningEku = @($signature.SignerCertificate.EnhancedKeyUsageList | Where-Object { $_.ObjectId -eq '1.3.6.1.5.5.7.3.3' })
          if ($codeSigningEku.Count -eq 0) {
            throw 'Signing certificate is not authorized for Code Signing. Refusing to publish.'
          }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"
          Write-Host "Timestamp authority: $($signature.TimeStamperCertificate.Subject)"
      - name: Zip Windows app and hash release file
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "MAH-DailyDesk-v$version-Windows-x64.zip"
          Compress-Archive -Path 'dist/MAH-DailyDesk' -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Attest release ZIP build provenance with GitHub
        uses: actions/attest@v4
        with:
          subject-path: MAH-DailyDesk-v${{ steps.version.outputs.version }}-Windows-x64.zip
      - name: Upload build artifact for debugging
        uses: actions/upload-artifact@v7
        with:
          name: MAH-DailyDesk-Windows-x64
          path: |
            MAH-DailyDesk-v${{ steps.version.outputs.version }}-Windows-x64.zip
            SHA256SUMS.txt
            screenshots/dashboard.png
            screenshots/tasks.png
            screenshots/settings.png
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $assets = @("MAH-DailyDesk-v$version-Windows-x64.zip", "SHA256SUMS.txt", "screenshots/dashboard.png", "screenshots/tasks.png", "screenshots/settings.png")
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MAH DailyDesk $tag — Windows" --notes-file release/RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub Release' }
